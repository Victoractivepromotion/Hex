name: CI — Build Hex (macOS)

# Builds Hex on GitHub-hosted macOS runners (Apple hardware + Xcode), so the app
# can be produced and iterated entirely from CI — no local Mac required for the
# build loop. Produces an installable (unsigned, ad-hoc-signed) Hex.app artifact.

on:
  push:
    branches: [agent-sandbox, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-core:
    name: HexCore unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          sudo xcode-select -p
          xcodebuild -version
          swift --version
      - name: swift test (HexCore)
        working-directory: HexCore
        run: swift test

  build-app:
    name: Build Hex.app (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: Build Hex (Release, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project Hex.xcodeproj \
            -scheme Hex \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="-" \
            build
      - name: Ad-hoc sign + package app
        run: |
          set -e
          APP="$(find build/Build/Products/Release -maxdepth 1 -name 'Hex.app' | head -1)"
          if [ -z "$APP" ]; then echo "Hex.app not found"; exit 1; fi
          echo "Built: $APP"
          # Ad-hoc signature so Gatekeeper lets the user open it after clearing quarantine.
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" Hex-unsigned.zip
          echo "Packaged Hex-unsigned.zip"
      - name: Upload Hex.app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hex-app-unsigned
          path: Hex-unsigned.zip
          if-no-files-found: error
