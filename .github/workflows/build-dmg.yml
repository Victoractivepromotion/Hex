name: Build DMG (unsigned)

# Builds an unsigned Hex.app and packages it into a DMG on every push to main
# and on manual dispatch. Signing/notarization is a later bonus layer — this
# produces an installable artifact now without any secrets configured.
on:
  push:
    branches: [main, heylarry]
  workflow_dispatch:

# Two overlapping runs both publish, and whichever finishes last wins — a
# failed build for an older commit once replaced a good DMG with just its
# error log. Newest push wins; older in-flight runs are cancelled.
concurrency:
  group: build-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dmg:
    runs-on: macos-15
    timeout-minutes: 40
    # Needed to publish the rolling prerelease below.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          set -euo pipefail
          XC="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XC" ]; then XC="/Applications/Xcode.app"; fi
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Build Release (unsigned)
        run: |
          set -uo pipefail
          # Tee to a file so the compiler diagnostics survive the job. Actions
          # logs need an authenticated download even on a public repo, so a
          # failed build is otherwise a dead end for anyone without a token —
          # the errors get published as a release asset below instead.
          set +e
          xcodebuild \
            -project Hex.xcodeproj \
            -scheme Hex \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -skipMacroValidation \
            build 2>&1 | tee build-full.log
          status=${PIPESTATUS[0]}
          set -e
          # Keep just the diagnostics; the full log is tens of MB.
          grep -E "error:|warning:.*Larry|BUILD (FAILED|SUCCEEDED)" build-full.log \
            | sort -u > build-errors.log || true
          echo "--- diagnostics ---"
          cat build-errors.log
          exit "$status"

      - name: Locate built .app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release -maxdepth 1 -name 'Hex.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "Hex.app not found" >&2
            find build/Build/Products -name '*.app' >&2 || true
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        run: |
          set -euo pipefail
          STAGING="$(mktemp -d)"
          cp -R "${{ steps.app.outputs.app_path }}" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "Hex" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "Hex.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hex-dmg
          path: Hex.dmg
          if-no-files-found: error

      # Actions artifacts require an authenticated download even on a public
      # repo, which means every test build has to be fetched by hand from a
      # browser. Release assets on a public repo do not — so the same DMG is
      # also published as a rolling prerelease at a stable URL:
      #
      #   https://github.com/Victoractivepromotion/Hex/releases/download/heylarry-latest/Hex.dmg
      #
      # That URL always serves the newest heylarry build and can be curled
      # directly, so installing never needs a manual download again.
      - name: Publish diagnostics (failed build)
        if: failure() && github.ref_name == 'heylarry'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Deliberately a different tag from the DMG release: a failed build
          # must never overwrite the last good installer.
          gh release delete heylarry-diagnostics --yes --cleanup-tag || true
          if [ -f build-errors.log ]; then
            gh release create heylarry-diagnostics build-errors.log \
              --prerelease \
              --title "Hey Larry — last failed build" \
              --notes "Compiler diagnostics for commit ${GITHUB_SHA}."
          fi

      - name: Publish rolling prerelease
        if: success() && github.ref_name == 'heylarry'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Replace the previous rolling release so the tag always points at
          # this build; ignore failure on the first run when it doesn't exist.
          gh release delete heylarry-latest --yes --cleanup-tag || true
          # Attach whatever exists: the DMG on success, the diagnostics either
          # way, so a failed build can be read without a token.
          # `[ -f ] &&` returns non-zero when the file is missing, which would
          # kill the step under set -e, and an empty array trips set -u — hence
          # the explicit guards.
          gh release create heylarry-latest Hex.dmg \
            --prerelease \
            --title "Hey Larry — rolling build" \
            --notes "Unsigned rolling build of the heylarry branch (commit ${GITHUB_SHA}). Replaced on every push."
